collections_config:
  pages:
    path: content
    name: Content
    icon: wysiwyg
  how_to:
    path: app
    name: App
    icon: photo
paths:
  static: ''
  uploads: docs/_static
timezone: America/New_York
markdown:
  engine: commonmark
  options: {}
_snippets_imports:
  python_markdown_extensions:
    include:
      - python_markdown_code_block
      - python_markdown_inline_code
      - python_markdown_tabs
_editables:
  content:
    bold: true
    italic: true
    bulletedlist: true
    numberedlist: true
    image: true
    table: true
    undo: true
    redo: true